name: Generate signing key

# Run this once, by hand, from the Actions tab. It mints a signing key and
# hands it back as a download. Nothing secret is ever printed to the log
# (logs are public on a public repo) or committed to the repo.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Create keystore
        run: |
          set -euo pipefail
          mkdir -p out

          # Generated on the runner, so the value never appears in this file
          # or in the workflow log.
          STORE_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 28)"
          ALIAS="bprdownloader"

          # 30 years: outliving the key means never being able to ship an
          # update that installs over the previous one.
          keytool -genkeypair \
            -keystore out/release.jks \
            -storetype JKS \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=BPR Downloader, O=BPRVT, C=US" \
            >/dev/null 2>&1

          base64 -w0 out/release.jks > out/KEYSTORE_B64.txt
          printf '%s' "$STORE_PASS" > out/KEYSTORE_PASSWORD.txt
          printf '%s' "$ALIAS"      > out/KEY_ALIAS.txt
          printf '%s' "$STORE_PASS" > out/KEY_PASSWORD.txt

          cat > out/README.txt <<'EOF'
          Add these as repository secrets:
            Settings -> Secrets and variables -> Actions -> New repository secret

            KEYSTORE_B64       = contents of KEYSTORE_B64.txt
            KEYSTORE_PASSWORD  = contents of KEYSTORE_PASSWORD.txt
            KEY_ALIAS          = contents of KEY_ALIAS.txt
            KEY_PASSWORD       = contents of KEY_PASSWORD.txt

          Paste each file's contents exactly, with no trailing newline or spaces.

          KEEP A BACKUP of KEYSTORE_B64.txt somewhere safe (password manager).
          If you lose this key you can never publish an update that installs
          over an existing install -- every future version would require
          uninstalling the app first, which wipes your download history.
          EOF

          # The raw keystore is redundant once base64-encoded, and shipping it
          # twice just doubles the places it can leak from.
          rm out/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/
          # Short window: download it, store it, and let the copy here expire.
          retention-days: 1
